name: Backup Atlas + Cloudinary

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout drinks-reviewer
        uses: actions/checkout@v5
        with:
          path: drinks-reviewer

      - name: Checkout drinks-reviewer-backup
        uses: actions/checkout@v5
        with:
          repository: noamros9/drinks-reviewer-backup
          token: ${{ secrets.BACKUP_REPO_PAT }}
          path: drinks-reviewer-backup

      - name: Configure git identity for backup commit
        working-directory: drinks-reviewer-backup
        run: |
          git config user.name "drinks-reviewer-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: drinks-reviewer
        run: npm ci --omit=dev

      - name: Run backup
        working-directory: drinks-reviewer
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: node server/scripts/backup-data.js

  # GitHub disables scheduled workflows after 60 days without a commit.
  # Re-enabling the workflow through the API resets that timer, so do it
  # once a month (on the 1st) to keep the daily backup running.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not the 1st of the month; skipping."
            exit 0
          fi
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable"
          echo "Workflow re-enabled; inactivity timer reset."
